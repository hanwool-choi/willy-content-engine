# .github/workflows/pulluk-brief.yml
name: 펄럭 데일리 브리핑

# 매일 09:00 KST. 즐겨찾기 갱신(06:20)이 끝난 뒤라 최신 데이터를 쓴다.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 데일리 보드·스튜디오와 gh-pages 푸시가 겹치지 않게 한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # anthropic·python-dotenv가 없으면 willy.analyzer / willy.config import가
      # 깨져서 Gemini 초안과 날씨 조회가 매일 조용히 폴백한다.
      - name: 의존성 설치
        run: pip install httpx truststore anthropic python-dotenv

      # 생성 → 게시 → 전송 순서다. 전송이 실패해도 페이지는 남아야 하고,
      # 카톡의 "전문 보기" 링크가 눌리는 시점엔 이미 살아 있어야 한다.
      - name: 브리핑 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python tools/pulluk_brief.py --out out_brief --no-send

      - name: gh-pages /brief 게시
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out_brief
          destination_dir: brief
          publish_branch: gh-pages
          keep_files: true
          commit_message: "publish: 데일리 브리핑"

      - name: 카톡 전송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python tools/pulluk_brief.py --send send_payload.json

      # 카카오는 리프레시 토큰 잔여 1개월 미만일 때만 새 토큰을 준다.
      # 그때 시크릿을 갱신하지 않으면 2개월 뒤 전송이 끊긴다.
      # 전송이 실패해도 회전된 토큰은 반드시 시크릿에 반영해야 한다.
      # always()가 없으면 앞 스텝 실패 시 이 스텝이 스킵돼 새 토큰이 유실되고,
      # 카카오는 이미 구 토큰을 무효화했기 때문에 다음 날부터 영구 실패한다.
      - name: 리프레시 토큰 회전
        if: ${{ always() && hashFiles('new_refresh_token.txt') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: gh secret set KAKAO_REFRESH_TOKEN < new_refresh_token.txt

      # 토큰이 만료되면 매일 실패한다. 같은 이슈에 코멘트만 달아 쌓이지 않게 한다.
      - name: 실패 알림 이슈
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="워크플로 실행이 실패했습니다. 카카오 토큰 만료(KOE322)일 수 있으니 tools/kakao_token_setup.py로 재발급 후 KAKAO_REFRESH_TOKEN 시크릿을 갱신하세요. 로그: ${RUN_URL}"
          # 결과가 없을 때 jq가 "null"을 뱉지 않도록 // empty를 붙인다.
          EXISTING=$(gh issue list --state open --search "데일리 브리핑 실패 in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "데일리 브리핑 실패 ($(date -u -d '+9 hours' +%Y-%m-%d))" \
              --body "$BODY"
          fi
