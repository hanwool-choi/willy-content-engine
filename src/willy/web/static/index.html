<!doctype html>
<meta charset="utf-8" />
<title>내일 뭐입지? 콘텐츠 엔진</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 24px; max-width: 1100px; }
  h1 { font-size: 20px; }
  .week { display: flex; gap: 8px; overflow-x: auto; margin: 16px 0; }
  .day { border: 1px solid #ddd; border-radius: 8px; padding: 10px; min-width: 110px; }
  .day.rainy { border-color: #3b82f6; background: #eff6ff; }
  .day.coarse { opacity: .7; }
  .slots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .slot { border: 1px solid #ddd; border-radius: 8px; padding: 8px; font-size: 12px; }
  .slot.empty { border-style: dashed; color: #b91c1c; }

  h2 { font-size: 15px; margin: 24px 0 8px; }
  .muted { color: #6b7280; font-weight: normal; font-size: 13px; }
  .pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 6px; font-size: 11px; }
  .card.unused { opacity: .45; }
  .card .badge { float: right; font-size: 10px; }
  .card .source-tag {
    display: inline-block; font-size: 9px; color: #4338ca; background: #eef2ff;
    border-radius: 4px; padding: 1px 4px; margin-bottom: 2px;
  }
  img.thumb {
    width: 100%; aspect-ratio: 3 / 4; object-fit: cover;
    border-radius: 6px; background: #f3f4f6; display: block; margin-bottom: 4px;
  }
  .pair { display: flex; gap: 4px; }
  .pair figure { flex: 1; margin: 0; }
  .pair figcaption { font-size: 10px; color: #6b7280; text-align: center; }
  .warn { background: #fef3c7; border-radius: 8px; padding: 10px; margin: 12px 0; }
  button { padding: 10px 16px; margin-right: 8px; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
</style>

<h1>내일 뭐입지? 콘텐츠 엔진</h1>

<p>
  <input type="date" id="base" />
  <button id="btn-gather">수집</button>
  <button id="btn-generate" disabled>1차 컨펌 · AI 생성</button>
  <button id="btn-finalize" disabled>최종 컨펌 · 폴더 생성</button>
</p>

<div id="warnings"></div>
<div class="week" id="week"></div>

<h2 id="pool-title" hidden>수집된 룩 <span class="muted" id="pool-count"></span> <span class="muted" id="pool-sources"></span></h2>
<div class="pool" id="pool"></div>

<h2 id="board-title" hidden>요일별 배정</h2>
<div class="slots" id="slots"></div>
<pre id="result"></pre>

<script>
  const $ = (id) => document.getElementById(id);
  $("base").valueAsDate = new Date();

  // 비전 모델과 외부 API에서 온 값은 그대로 innerHTML에 넣지 않는다.
  // 수집 대상이 제3자 사이트 이미지라, 그 안에 심긴 텍스트가 모델을 거쳐
  // 여기까지 흘러들어올 수 있다.
  const esc = (value) =>
    String(value ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);

  const SOURCE_LABELS = {
    musinsa_snap: "무신사",
    uniqlo_women: "유니클로W",
    uniqlo_men: "유니클로M",
    manual: "직접추가",
  };
  const sourceLabel = (source) => SOURCE_LABELS[source] ?? source;

  function render(data) {
    $("week").innerHTML = data.week.map((d) => `
      <div class="day ${d.is_rainy ? "rainy" : ""} ${d.resolution === "coarse" ? "coarse" : ""}">
        <b>${esc(d.weekday)}</b><br />${esc(d.date.slice(5))}<br />
        ${esc(d.sky)}<br />${esc(d.temp_max)}/${esc(d.temp_min)}℃<br />
        강수 ${esc(d.precip_prob)}%
      </div>`).join("");

    const pool = data.pool || [];
    $("pool-title").hidden = pool.length === 0;
    $("pool-count").textContent = pool.length
      ? `${pool.length}장 중 ${pool.filter((p) => p.assigned).length}장 배정됨`
      : "";
    if (pool.length) {
      const bySource = {};
      for (const p of pool) {
        bySource[p.source] = (bySource[p.source] || 0) + 1;
      }
      $("pool-sources").innerHTML = Object.entries(bySource)
        .map(([source, n]) => `${esc(sourceLabel(source))} ${esc(n)}`)
        .join(" · ");
    } else {
      $("pool-sources").innerHTML = "";
    }
    $("pool").innerHTML = pool.map((p) => `
      <div class="card ${p.assigned ? "" : "unused"}">
        <img class="thumb" src="${esc(p.image_url)}" alt="${esc(p.look_id)}" loading="lazy" />
        <span class="badge">${p.rain_ok ? "☔" : ""}</span>
        <span class="source-tag">${esc(sourceLabel(p.source))}</span><br />
        <b>${esc(p.look_id)}</b> · ${esc(p.gender)}<br />
        ${esc(p.temp_range.join("~"))}℃<br />
        ${esc(p.style_tags.join(", "))}
      </div>`).join("");

    $("board-title").hidden = data.slots.length === 0;
    $("slots").innerHTML = data.slots.map((s) => `
      <div class="slot ${s.empty ? "empty" : ""}">
        ${s.empty ? "" : `
          <div class="pair">
            <figure>
              <img class="thumb" src="${esc(s.image_url)}" alt="원본" loading="lazy" />
              <figcaption>참고 원본</figcaption>
            </figure>
            ${s.generated_url ? `
            <figure>
              <img class="thumb" src="${esc(s.generated_url)}" alt="발행용" loading="lazy" />
              <figcaption>발행용</figcaption>
            </figure>` : ""}
          </div>`}
        ${esc(s.date.slice(5))} · ${esc(s.gender)}<br />
        ${s.empty ? "비어 있음" : esc(s.look_id)}<br />
        ${s.temp_range ? esc(s.temp_range.join("~")) + "℃" : ""}<br />
        ${esc(s.style_tags.join(", "))}
      </div>`).join("");

    $("warnings").innerHTML = data.warnings.length
      ? `<div class="warn">${data.warnings.map((w) => `[${esc(w.code)}] ${esc(w.message)}`).join("<br />")}</div>`
      : "";
  }

  async function call(url, body) {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : null,
    });
    if (!response.ok) {
      alert((await response.json()).detail);
      throw new Error("실패");
    }
    return response.json();
  }

  $("btn-gather").onclick = async () => {
    render(await call("/api/gather", { base_date: $("base").value }));
    $("btn-generate").disabled = false;
    $("btn-finalize").disabled = true;
  };

  $("btn-generate").onclick = async () => {
    render(await call("/api/generate"));
    $("btn-finalize").disabled = false;
  };

  $("btn-finalize").onclick = async () => {
    const data = await call("/api/finalize");
    $("result").textContent = "생성 완료: " + data.output_path;
  };
</script>
