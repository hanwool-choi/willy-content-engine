[project]
name = "willy-content-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "scipy>=1.13",
    "python-docx>=1.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
